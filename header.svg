<svg width="100%" viewBox="0 0 680 180" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>terminal banner</title>
  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor { animation: blink 1.2s step-end infinite; }
    
    @keyframes fadeInLetter {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .l1  { opacity: 0; animation: fadeInLetter 0.05s 0.20s forwards; }
    .l2  { opacity: 0; animation: fadeInLetter 0.05s 0.27s forwards; }
    .l3  { opacity: 0; animation: fadeInLetter 0.05s 0.34s forwards; }
    .l4  { opacity: 0; animation: fadeInLetter 0.05s 0.41s forwards; }
    .l5  { opacity: 0; animation: fadeInLetter 0.05s 0.48s forwards; }
    .l6  { opacity: 0; animation: fadeInLetter 0.05s 0.55s forwards; }
    .l7  { opacity: 0; animation: fadeInLetter 0.05s 0.62s forwards; }
    .l8  { opacity: 0; animation: fadeInLetter 0.05s 0.69s forwards; }
    .l9  { opacity: 0; animation: fadeInLetter 0.05s 0.76s forwards; }
    .l10 { opacity: 0; animation: fadeInLetter 0.05s 0.83s forwards; }
    .l11 { opacity: 0; animation: fadeInLetter 0.05s 0.90s forwards; }
    .l12 { opacity: 0; animation: fadeInLetter 0.05s 0.97s forwards; }
    .l13 { opacity: 0; animation: fadeInLetter 0.05s 1.04s forwards; }
    .l14 { opacity: 0; animation: fadeInLetter 0.05s 1.11s forwards; }
  </style>

  <!-- Background -->
  <rect width="680" height="190" rx="8" fill="#050505"/>
  
  <!-- Header Title -->
  <text x="340" y="26" text-anchor="middle" font-family="monospace" font-size="11" fill="#555555">~/bilalElGohary/README.md</text>
  <line x1="0" y1="38" x2="680" y2="38" stroke="#1c1c1c" stroke-width="1"/>

  <!-- Command Prompt -->
  <text x="30" y="68" font-family="monospace" font-size="13" fill="#888888">$</text>
  <text x="46" y="68" font-family="monospace" font-size="13" fill="#ffffff">whoami</text>

  <!-- Animated Name Output -->
  <text font-family="monospace" font-size="24" font-weight="700" fill="#ffffff" y="100">
    <tspan class="l1" x="30">B</tspan><tspan class="l2">i</tspan><tspan class="l3">l</tspan><tspan class="l4">a</tspan><tspan class="l5">l</tspan><tspan class="l6">.</tspan><tspan class="l7">E</tspan><tspan class="l8">l</tspan><tspan class="l9">G</tspan><tspan class="l10">o</tspan><tspan class="l11">h</tspan><tspan class="l12">a</tspan><tspan class="l13">r</tspan><tspan class="l14">y</tspan>
  </text>

  <!-- Info Comments -->
  <text x="30" y="128" font-family="monospace" font-size="12" fill="#666666"># https://github.com/bilalElGohary</text>
  <text x="30" y="148" font-family="monospace" font-size="12" fill="#666666"># I am a developer &amp; artist. i had some solid base at front-end dev,</text>
  <text x="30" y="168" font-family="monospace" font-size="12" fill="#666666"># and some basic knowlage about ai, and at that time im deep into cybersecurity.</text>
  
</svg>

